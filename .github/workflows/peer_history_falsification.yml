name: peer-history-falsification

on:
  push:
    branches: [research-peer-history]
    paths:
      - 'research/peer_history_falsification.py'
      - '.github/workflows/peer_history_falsification.yml'

permissions:
  contents: write

jobs:
  run-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn tabulate

      - name: Download Rossmann public mirror
        run: |
          mkdir -p .tmp_rossmann
          curl -L --fail --retry 3 \
            -o .tmp_rossmann/rossmann.zip \
            'https://raw.githubusercontent.com/ShriyaChouhan/Retail_Sales_Prediction/main/Rossmann%20Stores%20Data.zip'
          unzip -q .tmp_rossmann/rossmann.zip -d .tmp_rossmann/data
          echo 'Extracted files:'
          find .tmp_rossmann/data -maxdepth 3 -type f -printf '%s %p\n' | sort -nr

      - name: Locate CSVs and run experiment
        shell: bash
        run: |
          STORE=$(find .tmp_rossmann/data -type f -iname 'store.csv' | head -n 1)
          TRAIN=$(find .tmp_rossmann/data -type f -iname '*.csv' ! -iname 'store.csv' -printf '%s %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)
          echo "STORE=$STORE"
          echo "TRAIN=$TRAIN"
          test -n "$STORE" && test -f "$STORE"
          test -n "$TRAIN" && test -f "$TRAIN"
          python research/peer_history_falsification.py \
            --train "$TRAIN" \
            --store "$STORE" \
            --outdir results/peer_history \
            --k 15 \
            --history-weeks 24 \
            --eval-weeks 8

      - name: Show verdict
        run: |
          cat results/peer_history/SUMMARY.md

      - name: Commit result tables
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/peer_history
          if git diff --cached --quiet; then
            echo 'No result changes.'
          else
            git commit -m 'Add peer-history falsification results'
            git push origin HEAD:research-peer-history
          fi
