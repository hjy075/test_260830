name: Historical GFS Access Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gdex-smoke.yml'
  workflow_dispatch:

jobs:
  access-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe OSDF raw 2017 object and AWS 2017 prefix
        shell: bash
        run: |
          set -uo pipefail
          FILE='gfs.0p25.2017081318.f009.grib2'
          OSDF='https://osdf-data.gdex.ucar.edu/ncar/gdex/d084001/2017/20170813/'"$FILE"
          echo '=== OSDF HEAD ==='
          curl -sS -L --connect-timeout 20 --max-time 60 -D /tmp/osdf_head -o /dev/null "$OSDF" || true
          cat /tmp/osdf_head || true
          echo '=== OSDF RANGE 0-1023 ==='
          code=$(curl -sS -L --connect-timeout 20 --max-time 60 -H 'Range: bytes=0-1023' -o /tmp/osdf_range -w '%{http_code}' "$OSDF" || true)
          echo "HTTP=$code BYTES=$(wc -c </tmp/osdf_range 2>/dev/null || echo 0)"
          if [ -s /tmp/osdf_range ]; then xxd -l 32 /tmp/osdf_range; fi
          echo '=== AWS LIST 2017 PREFIX ==='
          python - <<'PY'
          import requests
          for prefix in ['gfs.20170813','2017/20170813','20170813']:
              r=requests.get('https://noaa-gfs-bdp-pds.s3.amazonaws.com/',params={'list-type':'2','prefix':prefix,'max-keys':'3'},timeout=30)
              print('PREFIX',prefix,'STATUS',r.status_code,'HAS_KEY', '<Key>' in r.text, 'LEN',len(r.text))
              print(r.text[:500].replace('\n',' '))
          PY
