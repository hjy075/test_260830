name: Topic Lock Scheduled Orchestrator

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  dispatch-once:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: .
    steps:
      - name: Check one-shot marker issue
        id: marker
        run: |
          state=$(gh api repos/${GITHUB_REPOSITORY}/issues/2 --jq .state)
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "marker issue state=$state"
      - uses: actions/checkout@v4
        if: steps.marker.outputs.state == 'open'
      - uses: actions/setup-python@v5
        if: steps.marker.outputs.state == 'open'
        with:
          python-version: '3.11'
      - name: Verify current contracts before dispatch
        if: steps.marker.outputs.state == 'open'
        run: |
          pip install pytest pandas numpy requests xarray netCDF4 scikit-learn datasets pyarrow
          pytest -q tests/test_gdex_operational_gfs.py tests/test_gdex_sensitivity.py tests/test_seed_null_extended.py
      - name: Explicitly dispatch research continuations
        if: steps.marker.outputs.state == 'open'
        run: |
          gh workflow run seed-null-repair.yml --ref main
          gh workflow run gdex-sensitivity.yml --ref main
          echo 'dispatched seed-null-repair.yml and gdex-sensitivity.yml'
      - name: Close one-shot marker
        if: steps.marker.outputs.state == 'open'
        run: gh issue close 2 --repo ${GITHUB_REPOSITORY} --reason completed --comment 'Scheduled orchestrator dispatched the topic-lock continuation workflows.'
